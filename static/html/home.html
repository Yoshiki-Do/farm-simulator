<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farm Simulator</title>

    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/home.css">
</head>

<body>

    <div class="container">
    
        <h1>Farm Simulator</h1>

        <div class="save-slots" id="save-slots"></div>

        <template id="save-slot-template">
            <div class="save-slot">
                <h2></h2>

                <div class="save-info">
                    <p class="save-year">Year: -</p>

                    <p class="save-season-day">
                        <img class="save-season-image" src="/static/images/seasons/spring.png" alt="Season">
                        Day: -
                    </p>

                    <p class="save-money">Money: $0.00</p>
                </div>

                <div class="save-buttons">
                    <button>Continue</button>
                    <button>Delete</button>
                </div>
            </div>
        </template>

    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/home.js"></script>

</body>
</html>
