<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop</title>

    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/shop.css">
</head>

<body>
    <div class="container">

        <div class="shop-layout">

            <div class="left-sidebar">

                <div id="farm-info"></div>

                <div class="missions-box">

                    <div class="missions">
                        <h2>Missions</h2>

                        <div id="missions-list">
                            Loading...
                        </div>
                    </div>
                </div>

                <div class="market">
                    <h2>Market Prices</h2>

                    <div id="market-prices">
                        Loading...
                    </div>
                </div>

            </div>
            
            <div class="shop-main">

                <h2>Seeds</h2>

                <div id="seed-shop-items" class="seed-shop-items">
                    Loading...
                </div>

                <h2>Items</h2>

                <div id="item-shop-items" class="item-shop-items">
                    Loading...
                </div>
            </div>

            <div class="right-sidebar">

                <div class="inventory">

                    <h2>Inventory</h2>

                    <div class="inventory-box">
                        <div id="inventory-items">
                            Loading...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-menu-layout">

        <div class="main-menu">
            <button class="farm-button" onclick="location.href='/game'">Farm</button>

            <button class="shop-button" onclick="location.href='/shop'">Shop</button>

            <button class="market-button" onclick="location.href='/market-page'">Market</button>

        </div>

        <div class="other-menu">
            <button class="other-button">Other</button>

            <button class="other-button">Other</button>

            <button class="home-button" onclick="location.href='/'">Home</button>
            
        </div>

    </div>

    <template id="shop-item-template">

        <div class="shop-item">

            <img class="item-image">

            <span class="item-name"></span>

            <strong class="item-price"></strong>

            <button>Buy</button>

        </div>

    </template>
    
    <script src="/static/js/api.js"></script>    
    <script src="/static/js/common.js"></script>
    <script src="/static/js/market_common.js"></script>
    <script src="/static/js/inventory.js"></script>
    <script src="/static/js/shop.js"></script>

</body>
</html>
